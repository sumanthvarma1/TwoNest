services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: twonest
      POSTGRES_USER: twonest
      POSTGRES_PASSWORD: twonest
    ports: ["5432:5432"]
    volumes: ["twonest_db:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U twonest -d twonest"]
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    volumes: ["twonest_redis:/data"]
volumes:
  twonest_db:
  twonest_redis:
